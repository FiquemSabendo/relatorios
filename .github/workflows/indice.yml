# Regenera docs/index.html (o índice de relatorios.fiquemsabendo.com.br) sempre que
# um relatorio.json ou uma página publicada mudar, e faz commit do resultado.
name: Índice dos relatórios

on:
  push:
    branches: [main]
    paths:
      - "*/relatorio.json"
      - "docs/*/index.html"
      - "build_index.py"
      - "_identidade/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build_index.py
      - name: Commit se mudou
        run: |
          if git diff --quiet docs/index.html; then
            echo "índice já estava atualizado"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Atualiza o índice dos relatórios"
          git push
